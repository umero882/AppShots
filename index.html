<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AppShots helps you create App Store and Google Play screenshots in minutes — templates, device frames, gradients, and store-ready PNG exports."
    />
    <meta name="theme-color" content="#0b0b12" />
    <link rel="canonical" href="https://appshots.nextechlabs.tech/" />

    <!-- Social share cards. og-cover.png is generated by scripts/og/make-og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AppShots" />
    <meta property="og:url" content="https://appshots.nextechlabs.tech/" />
    <meta property="og:title" content="AppShots — App Store & Google Play Screenshot Generator" />
    <meta
      property="og:description"
      content="Create store-ready App Store and Google Play screenshots in minutes — templates, device frames, gradients, and pixel-exact PNG exports."
    />
    <meta property="og:image" content="https://appshots.nextechlabs.tech/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AppShots — store screenshots, done in minutes" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AppShots — App Store & Google Play Screenshot Generator" />
    <meta
      name="twitter:description"
      content="Create store-ready App Store and Google Play screenshots in minutes — templates, device frames, gradients, and pixel-exact PNG exports."
    />
    <meta name="twitter:image" content="https://appshots.nextechlabs.tech/og-cover.png" />

    <!-- Inter is self-hosted (see src/main.jsx) so it embeds into html-to-image exports. -->
    <title>AppShots — App Store & Google Play Screenshot Generator</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AppShots",
        "url": "https://appshots.nextechlabs.tech/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "description": "Create store-ready App Store and Google Play screenshots in minutes — templates, device frames, gradients, and pixel-exact PNG exports.",
        "publisher": { "@type": "Organization", "name": "Next Tech Labs" },
        "offers": [
          {
            "@type": "Offer",
            "name": "Free",
            "price": "0",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "9",
            "priceCurrency": "USD",
            "url": "https://appshots.nextechlabs.tech/pricing"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
